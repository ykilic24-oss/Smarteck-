<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
  <style>
    :root{
      --navy:#112B3B; --navy-2:#12314A; --koper:#BE612E; --koper-lt:#E8A882;
      --aqua-lt:#96CCCC; --zink:#5F6E78; --zink-lt:#AEB8BE;
      --display:'Space Grotesk','Arial Narrow',Arial,sans-serif;
      --body:'IBM Plex Sans',Arial,Helvetica,sans-serif;
      --mono:'IBM Plex Mono',Consolas,'Courier New',monospace;
    }
    *{box-sizing:border-box;margin:0;padding:0}
    body{background:var(--navy);color:var(--zink-lt);font-family:var(--body);font-size:17px;line-height:1.65;-webkit-font-smoothing:antialiased}
    img{max-width:100%;display:block}
    a{color:var(--koper-dk);text-decoration:none}
    a:hover{text-decoration:underline}
    .lbl{font-family:var(--mono);font-size:11.5px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:var(--zink)}
    .btn{display:inline-block;background:var(--koper-dk);color:#fff;font-weight:600;font-size:15px;padding:12px 20px;border:none;font-family:var(--body)}
    .mitem{display:flex;align-items:center;justify-content:space-between;gap:16px;min-height:56px;padding:14px 0;border-bottom:1px solid #1E4560;font-family:var(--display);font-weight:500;font-size:22px;letter-spacing:-0.02em;color:#fff}
  </style>
</helmet>
<div style="display:flex;flex-direction:column;width:390px;height:844px;overflow:hidden;background:#112B3B;">

  <div style="height:52px;flex-shrink:0;"></div>

  <header style="flex-shrink:0;">
    <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 20px;border-bottom:1px solid #1E4560;">
      <img src="smarteck-logo.png" alt="Smarteck" style="height:24px;width:auto;display:block">
      <span style="display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;border:1px solid #5F6E78;flex-shrink:0;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" stroke="#AEB8BE" stroke-width="1.8" stroke-linecap="round"></path></svg>
      </span>
    </div>
  </header>

  <nav style="display:flex;flex-direction:column;padding:20px 20px 0;flex-grow:1;min-height:0;">
    <span class="mitem">Het vraagstuk<svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M5 12h13M13 7l5 5-5 5" stroke="#5F6E78" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"></path></svg></span>
    <span class="mitem">Voor wie<svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M5 12h13M13 7l5 5-5 5" stroke="#5F6E78" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"></path></svg></span>
    <span class="mitem">Werkwijze<svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M5 12h13M13 7l5 5-5 5" stroke="#5F6E78" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"></path></svg></span>
    <span class="mitem">Wat wij doen<svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M5 12h13M13 7l5 5-5 5" stroke="#5F6E78" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"></path></svg></span>
    <span class="mitem" style="border-bottom:none">Waarom wij<svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M5 12h13M13 7l5 5-5 5" stroke="#5F6E78" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"></path></svg></span>
  </nav>

  <div style="display:flex;flex-direction:column;gap:20px;padding:24px 20px 40px;border-top:1px solid #1E4560;flex-shrink:0;">
    <span class="btn" style="display:block;text-align:center;padding:15px 20px;">Laat de vormen doorrekenen</span>
    <div style="display:flex;flex-direction:column;gap:6px;">
      <span class="lbl">Contact</span>
      <span style="font-size:15.5px;color:#E8A882;">info@smarteck.nl</span>
      <span style="font-size:15.5px;color:#AEB8BE;">Den Haag, Nederland</span>
    </div>
  </div>

</div>
</x-dc>
</body>
</html>
