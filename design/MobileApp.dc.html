<div style="display: flex; flex-direction: column; width: 390px; height: 844px; background: #141310; color: #F2EEE6; font-family: 'IBM Plex Sans', system-ui, sans-serif; font-size: 16px; line-height: 1.5;">

        <div style="display: flex; flex-direction: column; gap: 14px; padding: 16px; border: 1px solid #2E2A22; border-radius: 15px; background: #1C1A16; min-height: 132px;">
          <div style="display: flex; align-items: flex-start; justify-content: space-between; gap: 10px;">

          </div>
        </div>

        <div style="display: flex; flex-direction: column; gap: 14px; padding: 16px; border: 1px solid #2E2A22; border-radius: 15px; background: #1C1A16; min-height: 132px;">
          <div style="display: flex; align-items: flex-start; justify-content: space-between; gap: 10px;">

    <span style="display: flex; flex-direction: column; align-items: center; gap: 5px; padding: 8px 0; color: #E9A23B;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 20V9.5L12 4l8 5.5V20" stroke="#E9A23B" stroke-width="1.6" stroke-linejoin="round"></path><path d="M9.5 20v-6h5v6" stroke="#E9A23B" stroke-width="1.6" stroke-linejoin="round"></path></svg>
